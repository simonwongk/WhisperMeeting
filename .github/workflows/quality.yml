name: Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  # Fast-cancel superseded runs on feature branches/PRs, but let every push to
  # main run to completion — otherwise the next push cancels it and main never
  # gets a finished gate result (F115).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-build-package:
    runs-on: macos-15
    # The gate runs a full swift test plus two release builds (step 3's
    # -warnings-as-errors build and build-app.sh's) on a cold runner, which
    # exceeds 20 min — runs were being killed mid-build at the old limit (F115).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify, test, build, and package
        run: Scripts/quality-check.sh
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
